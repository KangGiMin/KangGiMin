name: Generate Snake

# 언제 이 스크립트를 실행할지 설정하는 부분이야.
on:
  schedule:
    # 매일 자정(UTC 기준)에 한 번씩 자동으로 실행!
    - cron: "0 0 * * *"
  workflow_dispatch: # 네가 원할 때 수동으로 버튼 눌러서 실행할 수 있게 해줘.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 여기가 핵심! 뱀 애니메이션 이미지를 생성하는 액션이야.
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # 생성될 이미지 파일의 이름과 경로 (보라색이 포함된 다크모드 팔레트 적용)
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 만들어진 이미지를 'output'이라는 브랜치에 푸시(저장)해주는 작업이야.
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
